# CoffeeKernel: ONE dynamically tunable kernel, not separate performance builds.
# Keep a broad x86-64 hardware baseline. Runtime profiles change supported CPU,
# preemption, memory and power preferences without requiring multiple kernels.

# Low-latency desktop scheduling while retaining PREEMPT_DYNAMIC runtime support.
CONFIG_PREEMPT=y
# CONFIG_PREEMPT_VOLUNTARY is not set
# CONFIG_PREEMPT_NONE is not set
# CONFIG_PREEMPT_RT is not set
CONFIG_PREEMPT_DYNAMIC=y
CONFIG_HZ_1000=y
# CONFIG_HZ_250 is not set
# CONFIG_HZ_300 is not set
# CONFIG_HZ_100 is not set
CONFIG_HIGH_RES_TIMERS=y
CONFIG_SCHED_AUTOGROUP=y
# Release kernel: keep scheduler debug instrumentation out of the hot path.
# CONFIG_SCHED_DEBUG is not set

# Compile for performance, but never use -march=native in a distributable kernel.
CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
# CONFIG_CC_OPTIMIZE_FOR_SIZE is not set

# Modern CPU frequency drivers remain available in the one generic kernel.
CONFIG_X86_INTEL_PSTATE=y
CONFIG_X86_AMD_PSTATE=y

# Keep multiple I/O schedulers so runtime policy can choose per device.
CONFIG_MQ_IOSCHED_DEADLINE=y
CONFIG_IOSCHED_BFQ=m
CONFIG_BFQ_GROUP_IOSCHED=y

# ZRAM is used by CoffeeOS on memory-constrained systems. LZ4 is the fast default;
# Zstd is available for recompression when supported by the running kernel.
CONFIG_ZSMALLOC=y
CONFIG_ZRAM=m
CONFIG_ZRAM_BACKEND_LZ4=y
CONFIG_ZRAM_BACKEND_ZSTD=y
CONFIG_ZRAM_DEF_COMP_LZ4=y
CONFIG_ZRAM_MULTI_COMP=y

# THP remains available but defaults to madvise to avoid surprise compaction stalls;
# games/runtimes that explicitly request huge pages can still receive them.
CONFIG_TRANSPARENT_HUGEPAGE=y
# CONFIG_TRANSPARENT_HUGEPAGE_ALWAYS is not set
CONFIG_TRANSPARENT_HUGEPAGE_MADVISE=y
# CONFIG_TRANSPARENT_HUGEPAGE_NEVER is not set


# sched_ext: optional BPF scheduler framework. CoffeeOS never forces an
# experimental scheduler; users can load/stop one dynamically and the kernel
# falls back to the fair scheduler if sched_ext aborts.
CONFIG_BPF=y
CONFIG_BPF_SYSCALL=y
CONFIG_BPF_JIT=y
CONFIG_BPF_JIT_ALWAYS_ON=y
CONFIG_BPF_JIT_DEFAULT_ON=y
CONFIG_SCHED_CLASS_EXT=y
CONFIG_DEBUG_INFO_BTF=y

# Keep deterministic CoffeeKernel package names.
# CONFIG_LOCALVERSION_AUTO is not set
# Debian certificate paths, if any, are sanitized by kernel/tools/configure.py.
