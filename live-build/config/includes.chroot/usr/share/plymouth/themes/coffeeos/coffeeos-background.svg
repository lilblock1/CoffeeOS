<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#090504"/>
    <stop offset=".55" stop-color="#1a0d08"/>
    <stop offset="1" stop-color="#4b2415"/>
  </linearGradient>
  <radialGradient id="halo" cx=".53" cy=".42" r=".48">
    <stop offset="0" stop-color="#8f4f27" stop-opacity=".48"/>
    <stop offset=".55" stop-color="#492213" stop-opacity=".2"/>
    <stop offset="1" stop-color="#1a0d08" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="cup" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffe1bb"/>
    <stop offset=".16" stop-color="#9c5b35"/>
    <stop offset=".48" stop-color="#32160e"/>
    <stop offset=".82" stop-color="#6d351f"/>
    <stop offset="1" stop-color="#f4bf80"/>
  </linearGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff0d3"/>
    <stop offset=".5" stop-color="#d79a5c"/>
    <stop offset="1" stop-color="#fff0d3"/>
  </linearGradient>
  <linearGradient id="coffee" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#4a1f0f"/>
    <stop offset="1" stop-color="#130806"/>
  </linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="16"/></filter>
</defs>

<rect width="1920" height="1080" fill="url(#bg)"/>
<rect width="1920" height="1080" fill="url(#halo)"/>

<!-- soft coffee-colored atmospheric waves -->
<path d="M-100 520 C280 400 430 650 770 585 S1270 460 2020 610" fill="none" stroke="#9a542c" stroke-opacity=".13" stroke-width="44" filter="url(#blur)"/>
<path d="M-120 610 C320 470 560 760 980 650 S1460 505 2050 590" fill="none" stroke="#c0713b" stroke-opacity=".10" stroke-width="24" filter="url(#blur)"/>
<path d="M-100 695 C350 590 610 805 1010 700 S1500 610 2050 700" fill="none" stroke="#71381f" stroke-opacity=".18" stroke-width="72" filter="url(#blur)"/>

<!-- cup glow -->
<ellipse cx="960" cy="548" rx="250" ry="38" fill="#d58d4b" opacity=".22" filter="url(#glow)"/>
<ellipse cx="960" cy="548" rx="145" ry="17" fill="#f1bd7a" opacity=".22" filter="url(#soft)"/>

<!-- cup -->
<g>
  <path d="M815 405 C825 514 844 557 930 574 C1015 590 1077 548 1095 405 Z" fill="url(#cup)"/>
  <ellipse cx="955" cy="406" rx="141" ry="30" fill="url(#rim)"/>
  <ellipse cx="955" cy="410" rx="127" ry="21" fill="url(#coffee)"/>
  <ellipse cx="955" cy="407" rx="122" ry="13" fill="#7f3c1e" opacity=".75"/>
  <path d="M1081 432 C1160 398 1207 430 1198 492 C1190 548 1137 566 1084 535" fill="none" stroke="#d8995f" stroke-width="24" stroke-linecap="round"/>
  <path d="M1089 447 C1141 426 1170 447 1165 487 C1161 516 1133 530 1096 512" fill="none" stroke="#4b2416" stroke-width="11" stroke-linecap="round"/>
  <path d="M835 436 C856 520 889 548 943 556" fill="none" stroke="#f4c990" stroke-opacity=".35" stroke-width="7" stroke-linecap="round"/>
  <path d="M1068 429 C1058 507 1037 542 1004 559" fill="none" stroke="#f9d6a4" stroke-opacity=".22" stroke-width="5" stroke-linecap="round"/>
</g>

<!-- branding -->
<text x="960" y="690" text-anchor="middle" font-family="Cantarell,DejaVu Sans,sans-serif" font-size="98" font-weight="300" fill="#f8e8d2">CoffeeOS</text>
<text x="960" y="748" text-anchor="middle" font-family="Cantarell,DejaVu Sans,sans-serif" font-size="27" font-weight="300" letter-spacing="10" fill="#c8946d">Brewing your session...</text>

<!-- subtle light under loading area; real bar is drawn by Plymouth -->
<ellipse cx="960" cy="808" rx="280" ry="19" fill="#e29a58" opacity=".09" filter="url(#soft)"/>
</svg>
