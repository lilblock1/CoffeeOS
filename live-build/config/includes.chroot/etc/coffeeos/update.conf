# CoffeeOS official updates are hosted as a signed APT repository on GitHub Pages.
# The first installed-system update check downloads the public signing key over
# HTTPS, validates that it is a public OpenPGP key, then configures APT Signed-By.
#
# Disable CoffeeOS GitHub updates: sudo coffee-update clear-feed
# Re-enable them: sudo coffee-update use-github dev
COFFEEOS_FEED_URL=https://lilblock1.github.io/CoffeeOS
COFFEEOS_FEED_SUITE=dev
COFFEEOS_GITHUB_AUTO=1
COFFEEOS_GITHUB_REPO=lilblock1/CoffeeOS
