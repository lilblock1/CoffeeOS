# CoffeeOS built-in updates come directly from moving GitHub Releases.
# Each channel has one release tag: coffeeos-updates-dev/beta/stable.
# The updater downloads coffeeos-update.json and verifies every .deb SHA-256
# and package/version/architecture metadata before APT installs it.
#
# Disable CoffeeOS GitHub updates: sudo coffee-update clear-feed
# Re-enable them: sudo coffee-update use-github dev
COFFEEOS_FEED_URL=
COFFEEOS_FEED_SUITE=dev
COFFEEOS_GITHUB_AUTO=1
COFFEEOS_GITHUB_REPO=lilblock1/CoffeeOS
