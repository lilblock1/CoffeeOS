# CoffeeOS conservative GameMode defaults.
# GameMode restores temporary settings when the client exits. CoffeeOS does not
# enable GPU overclocking, clock offsets, unsafe scheduler patches, or mitigation
# changes here.
[general]
reaper_freq=5
desiredgov=performance
softrealtime=off
renice=0
ioprio=0
inhibit_screensaver=1
disable_splitlock=0

[gpu]
apply_gpu_optimisations=0

[cpu]
park_cores=no
# Leave hybrid-core pinning to GameMode's maintained defaults/user config.
