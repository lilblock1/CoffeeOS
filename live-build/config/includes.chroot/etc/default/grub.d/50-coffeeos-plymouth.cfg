# CoffeeOS branded graphical boot splash.
case " \${GRUB_CMDLINE_LINUX_DEFAULT:-} " in
  *" quiet "*) ;;
  *) GRUB_CMDLINE_LINUX_DEFAULT="\${GRUB_CMDLINE_LINUX_DEFAULT:-} quiet" ;;
esac
case " \${GRUB_CMDLINE_LINUX_DEFAULT:-} " in
  *" splash "*) ;;
  *) GRUB_CMDLINE_LINUX_DEFAULT="\${GRUB_CMDLINE_LINUX_DEFAULT:-} splash" ;;
esac
