# Increment only when CoffeeOS changes compiler policy/flags in a way that
# requires rebuilding otherwise unchanged Debian sources. Keep this independent
# from the CoffeeOS release number so normal UI/theme updates do not force Mesa,
# PipeWire, etc. to be recompiled.
COFFEE_OPT_CACHE_ABI=1000
COFFEE_KERNEL_CACHE_ABI=1000
