name: CoffeeOS CI

on:
  push:
    branches: [main, dev, beta, stable]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Repository bootstrap checks
        run: |
          test -f README.md
          test -f LICENSE
          test -f docs/GITHUB-INFRASTRUCTURE.md
          test -f docs/RELEASING.md

      - name: Detect CoffeeOS source
        id: source
        run: |
          if [[ -f scripts/validate.sh && -d tests ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Infrastructure exists, but the full CoffeeOS source tree has not been imported yet."
          fi

      - name: Install test tools
        if: steps.source.outputs.ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 bash shellcheck xz-utils dpkg-dev

      - name: Shell syntax
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          while IFS= read -r -d '' f; do
            bash -n "$f"
          done < <(find scripts live-build -type f \( -name '*.sh' -o -name '*.hook.chroot' -o -name '*.hook.binary' -o -path '*/auto/config' \) -print0)

      - name: Python tests
        if: steps.source.outputs.ready == 'true'
        run: python3 -m unittest discover -s tests -v

      - name: CoffeeOS validation
        if: steps.source.outputs.ready == 'true'
        run: bash scripts/validate.sh
