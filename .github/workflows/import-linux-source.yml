name: Import CoffeeOS Linux source

on:
  push:
    branches:
      - setup/coffeeos-infrastructure
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: setup/coffeeos-infrastructure
          fetch-depth: 0

      - name: Reassemble CoffeeOS Linux source
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f .bootstrap-source/chunk-000
          mkdir -p /tmp/coffeeos-import
          cat .bootstrap-source/chunk-* | base64 --decode > /tmp/coffeeos-source.tar.xz
          tar -xJf /tmp/coffeeos-source.tar.xz -C /tmp/coffeeos-import
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='LICENSE' --exclude='scripts/ci/' --exclude='docs/GITHUB-INFRASTRUCTURE.md' --exclude='docs/SIGNING.md' --exclude='docs/RELEASING.md' /tmp/coffeeos-import/ ./
          rm -rf .bootstrap-source
          rm -f .github/workflows/import-linux-source.yml

      - name: Validate imported source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s tests -v
          bash scripts/validate.sh

      - name: Verify Windows builder is absent
        shell: bash
        run: |
          set -Eeuo pipefail
          test ! -e windows
          test ! -e linux/wsl-builder.sh
          test -f scripts/build-iso.sh
          test -f live-build/auto/config
          test -f kernel/configs/coffee.conf

      - name: Commit expanded Linux source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "CoffeeOS CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "source: import CoffeeOS 0.10 Linux ISO build tree"
          git push origin HEAD:setup/coffeeos-infrastructure
