name: Publish CoffeeOS Channel

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [dev, beta, stable]
        default: dev
      version:
        description: CoffeeOS package version, e.g. 0.10.0~dev2 or 0.10.0
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: coffeeos-publish-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - name: Require signing secrets
        shell: bash
        env:
          KEY: ${{ secrets.COFFEEOS_GPG_PRIVATE_KEY }}
        run: |
          test -n "$KEY" || {
            echo "::error::Missing COFFEEOS_GPG_PRIVATE_KEY GitHub Actions secret."
            exit 1
          }

      - name: Install repository tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gnupg

      - name: Import CoffeeOS release signing key
        shell: bash
        env:
          COFFEEOS_GPG_PRIVATE_KEY: ${{ secrets.COFFEEOS_GPG_PRIVATE_KEY }}
          COFFEEOS_GPG_PASSPHRASE: ${{ secrets.COFFEEOS_GPG_PASSPHRASE }}
        run: bash scripts/ci/import-signing-key.sh

      - name: Build CoffeeOS system package
        env:
          COFFEEOS_PACKAGE_VERSION: ${{ inputs.version }}
        run: bash scripts/build-coffeeos-system-package.sh

      - name: Build signed APT repository
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          KEY_ID="$(cat "$RUNNER_TEMP/coffeeos-signing-key-id")"
          bash scripts/make-update-repo.sh             --suite "$CHANNEL"             --key "$KEY_ID"             --output "dist/update-repo"

      - name: Generate checksums
        shell: bash
        run: |
          cd dist/update-repo
          find pool -type f -name '*.deb' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/update-repo

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
