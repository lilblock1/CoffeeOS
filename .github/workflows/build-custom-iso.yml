name: Build CoffeeOS CoffeeKernel ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # Explicit request file lets CoffeeOS build an ISO immediately when the
      # maintainer asks for one without restoring "build on every push".
      - .github/coffeeos-iso-request
      # These are the meaningful CoffeeOS changes that count toward the
      # 20-update ISO cadence. Tests/docs/workflow-only changes do not count.
      - live-build/**
      - scripts/build-iso.sh
      - scripts/build-coffeeos-system-package.sh
      - scripts/build-coffeekernel-for-iso.sh
      - scripts/build-kernel.sh
      - kernel/**
      - optimization/**

permissions:
  contents: write

# Only one CoffeeKernel ISO build should run at a time. A newer run supersedes
# any older run that also uses this concurrency group.
concurrency:
  group: coffeeos-coffeekernel-iso
  cancel-in-progress: false

jobs:
  cadence:
    name: Check ISO release cadence
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.cadence.outputs.should_build }}
      major_count: ${{ steps.cadence.outputs.major_count }}
      baseline: ${{ steps.cadence.outputs.baseline }}
      reason: ${{ steps.cadence.outputs.reason }}
    steps:
      - name: Check out CoffeeOS history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Count meaningful updates since last published ISO
        id: cadence
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -Eeuo pipefail

          # Manual workflow dispatch always means "build it now".
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "major_count=manual" >> "$GITHUB_OUTPUT"
            echo "baseline=manual" >> "$GITHUB_OUTPUT"
            echo "reason=manual workflow request" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A change to the explicit request file also means "build it now".
          if git diff-tree --no-commit-id --name-only -r HEAD | grep -qx '.github/coffeeos-iso-request'; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "major_count=requested" >> "$GITHUB_OUTPUT"
            echo "baseline=request-file" >> "$GITHUB_OUTPUT"
            echo "reason=explicit CoffeeOS ISO request" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The newest successfully published stock or CoffeeKernel ISO is the
          # cycle baseline. Because each release tag points to its source
          # commit, publishing an ISO automatically resets the counter.
          baseline_tag="$(
            git for-each-ref               --sort=-creatordate               --format='%(refname:short)'               refs/tags/coffeeos-stock-* refs/tags/coffeeos-coffeekernel-*               | head -n1
          )"

          if [[ -n "$baseline_tag" ]]; then
            baseline="$baseline_tag"
            range="$baseline_tag..HEAD"
          else
            baseline="$(git rev-list --max-parents=0 HEAD | tail -n1)"
            range="$baseline..HEAD"
          fi

          # One commit counts as one meaningful update if it changes the OS,
          # installer, kernel or image build inputs. Pure docs/tests/CI changes
          # intentionally do not advance the ISO counter.
          major_count="$(
            git rev-list "$range" --               live-build               kernel               optimization               scripts/build-iso.sh               scripts/build-coffeeos-system-package.sh               scripts/build-coffeekernel-for-iso.sh               scripts/build-kernel.sh               | wc -l               | tr -d ' '
          )"

          echo "major_count=$major_count" >> "$GITHUB_OUTPUT"
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"

          if (( major_count >= 20 )); then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "reason=$major_count meaningful updates accumulated" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "reason=$major_count of 20 meaningful updates accumulated" >> "$GITHUB_OUTPUT"
          fi

          echo "CoffeeOS ISO cadence: $major_count / 20 meaningful updates since $baseline"

  build:
    name: Build CoffeeKernel ISO
    needs: cadence
    if: needs.cadence.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out CoffeeOS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate all CoffeeOS source and unit tests
        run: |
          set -Eeuo pipefail
          bash scripts/validate.sh

      - name: Restore reusable CoffeeKernel cache
        id: coffeekernel-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/coffeekernel
          # The final run-id component makes every successful save immutable.
          # restore-keys selects the newest cache with identical CoffeeKernel
          # build inputs. The build script still checks Debian source/config
          # versions inside the cache before it trusts a package pair.
          key: coffeekernel-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('kernel/configs/coffee.conf', 'kernel/tools/configure.py', 'scripts/build-kernel.sh', 'scripts/build-coffeekernel-for-iso.sh', 'optimization/cache-policy.conf') }}-${{ github.run_id }}
          restore-keys: |
            coffeekernel-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('kernel/configs/coffee.conf', 'kernel/tools/configure.py', 'scripts/build-kernel.sh', 'scripts/build-coffeekernel-for-iso.sh', 'optimization/cache-policy.conf') }}-

      - name: Seed cache from latest CoffeeKernel release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          seed="$PWD/.cache/release-seed"
          rm -rf "$seed"
          mkdir -p "$seed"

          # A release is only a candidate when none of the files that define
          # CoffeeKernel changed since that release tag. Debian source-version
          # compatibility is checked again inside the Debian build container.
          tag="$(gh release list --limit 100 --json tagName,publishedAt \
            --jq 'map(select(.tagName | startswith("coffeeos-coffeekernel-"))) | sort_by(.publishedAt) | reverse | .[0].tagName // ""')"
          if [[ -z "$tag" ]]; then
            echo "[CoffeeOS kernel] No prior CoffeeKernel release is available yet."
            exit 0
          fi

          git fetch --force --no-tags origin "refs/tags/$tag:refs/tags/$tag" || {
            echo "[CoffeeOS kernel] Could not fetch release tag $tag; normal cache/build path will be used."
            exit 0
          }
          tag_commit="$(git rev-list -n 1 "$tag")"

          if ! git diff --quiet "$tag_commit" HEAD -- \
            kernel/configs/coffee.conf \
            kernel/tools/configure.py \
            scripts/build-kernel.sh \
            scripts/build-coffeekernel-for-iso.sh \
            optimization/cache-policy.conf; then
            echo "[CoffeeOS kernel] Kernel inputs changed since $tag; released kernel will not be reused."
            exit 0
          fi

          if gh release download "$tag" \
            --pattern 'linux-image-*-coffee_*.deb' \
            --pattern 'linux-headers-*-coffee_*.deb' \
            --pattern 'SHA256SUMS' \
            --dir "$seed"; then
            printf "%s\n" "$tag" > "$seed/.release-tag"
            echo "[CoffeeOS kernel] Downloaded reusable kernel candidate from $tag."
          else
            echo "[CoffeeOS kernel] Release $tag does not contain a complete reusable kernel pair."
            rm -rf "$seed"
            mkdir -p "$seed"
          fi

      - name: Free runner disk space
        run: |
          set -Eeuo pipefail
          echo "Before cleanup:"
          df -h /
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af || true
          echo "After cleanup:"
          df -h /

      - name: Check memory and use swap if available
        run: |
          set -Eeuo pipefail
          free -h
          echo "Existing swap:"
          swapon --show || true

          # GitHub-hosted runners may already have /swapfile active. Do not
          # fail the build if swap cannot be created or enabled.
          if ! swapon --show --noheadings | grep -q .; then
            if sudo fallocate -l 8G /mnt/coffeeos-swapfile 2>/dev/null; then
              sudo chmod 600 /mnt/coffeeos-swapfile
              sudo mkswap /mnt/coffeeos-swapfile
              sudo swapon /mnt/coffeeos-swapfile || true
            fi
          fi

          echo "Memory after optional swap setup:"
          free -h

      - name: Prepare verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorriso squashfs-tools qemu-system-x86 qemu-utils ovmf

      - name: Build or reuse CoffeeKernel and build CoffeeOS ISO in Debian 13
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          docker run --rm --privileged \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e DEBIAN_FRONTEND=noninteractive \
            -e COFFEE_KERNEL_JOBS=2 \
            -e COFFEE_KERNEL_CACHE_DIR=/workspace/.cache/coffeekernel \
            -e CCACHE_DIR=/workspace/.cache/ccache \
            debian:trixie \
            bash -lc '
              set -Eeuo pipefail

              apt-get update
              apt-get install -y --no-install-recommends \
                live-build debootstrap squashfs-tools xorriso \
                grub-pc-bin grub-efi-amd64-bin grub2-common \
                mtools dosfstools isolinux syslinux-common \
                ca-certificates gnupg rsync curl python3 \
                build-essential dpkg-dev devscripts fakeroot apt-utils \
                bc bison flex kmod cpio libelf-dev libssl-dev libncurses-dev \
                dwarves debhelper ccache procps zstd \
                linux-source-6.12 linux-config-6.12 \
                linux-image-amd64 linux-headers-amd64 initramfs-tools

              echo "[CoffeeOS] Build host:"
              cat /etc/os-release
              uname -m
              free -h
              df -h /workspace

              echo "[CoffeeOS] Debian kernel source/config versions:"
              dpkg-query -W linux-source-6.12 linux-config-6.12

              # If Actions cache did not already contain the exact internal
              # cache key, validate the latest released kernel against this
              # Debian build environment and seed the normal cache directory.
              seed=/workspace/.cache/release-seed
              if [[ -s "$seed/SHA256SUMS" && -s "$seed/.release-tag" ]]; then
                if (cd "$seed" && sha256sum -c SHA256SUMS >/dev/null 2>&1); then
                  shopt -s nullglob
                  seed_images=("$seed"/linux-image-*-coffee_*.deb)
                  seed_headers=("$seed"/linux-headers-*-coffee_*.deb)
                  shopt -u nullglob
                  if [[ ${#seed_images[@]} -eq 1 && ${#seed_headers[@]} -eq 1 ]]; then
                    source_version="$(dpkg-query -W -f="\${Version}" linux-source-6.12 2>/dev/null || true)"
                    config_version="$(dpkg-query -W -f="\${Version}" linux-config-6.12 2>/dev/null || true)"
                    CACHE_ABI=1000
                    POLICY=/workspace/optimization/cache-policy.conf
                    # shellcheck disable=SC1090
                    [[ ! -f "$POLICY" ]] || source "$POLICY"
                    CACHE_ABI=${COFFEE_KERNEL_CACHE_ABI:-1000}
                    expected_version="${source_version}+coffee${CACHE_ABI}"
                    image_version="$(dpkg-deb -f "${seed_images[0]}" Version 2>/dev/null || true)"
                    header_version="$(dpkg-deb -f "${seed_headers[0]}" Version 2>/dev/null || true)"

                    if [[ -n "$source_version" && "$source_version" == "$config_version" \
                          && "$image_version" == "$expected_version" \
                          && "$header_version" == "$expected_version" ]]; then
                      fragment_sha="$(sha256sum /workspace/kernel/configs/coffee.conf | awk "{print \\$1}")"
                      gccver="$(gcc -dumpfullversion -dumpversion 2>/dev/null || gcc -dumpversion 2>/dev/null || echo unknown)"
                      material="source=$source_version\nconfig=$config_version\nfragment=$fragment_sha\ngcc=$gccver\narch=$(dpkg --print-architecture)\ncache-abi=$CACHE_ABI\n"
                      key="$(printf "%b" "$material" | sha256sum | awk "{print \\$1}")"
                      cache="/workspace/.cache/coffeekernel/$key"
                      tmp="$cache.release.$$"
                      rm -rf "$tmp"
                      mkdir -p "$tmp"
                      cp -f -- "${seed_images[0]}" "${seed_headers[0]}" "$seed/SHA256SUMS" "$tmp/"
                      release_tag="$(cat "$seed/.release-tag")"
                      printf "%s\\n" "{\"source\":\"github-release\",\"release\":\"$release_tag\",\"debian_source_version\":\"$source_version\",\"cache_key\":\"$key\"}" > "$tmp/build-info.json"
                      if (cd "$tmp" && sha256sum -c SHA256SUMS >/dev/null 2>&1); then
                        rm -rf "$cache"
                        mv "$tmp" "$cache"
                        echo "[CoffeeOS kernel] RELEASE HIT: seeded exact cache key from $release_tag"
                      else
                        rm -rf "$tmp"
                      fi
                    else
                      echo "[CoffeeOS kernel] Released package version does not match current Debian kernel source; ignoring release seed."
                      echo "[CoffeeOS kernel] expected=$expected_version image=$image_version headers=$header_version"
                    fi
                  fi
                else
                  echo "[CoffeeOS kernel] Release seed checksum validation failed; ignoring it."
                fi
              fi

              rm -rf optimized-kernel-build dist/kernels/coffee build
              rm -f live-build/config/packages.chroot/linux-image-*-coffee_*.deb 2>/dev/null || true
              mkdir -p .cache/coffeekernel .cache/ccache dist

              echo "[CoffeeOS] Restoring or compiling CoffeeKernel..."
              bash scripts/build-coffeekernel-for-iso.sh --mode deep --jobs 2 \
                2>&1 | tee dist/github-coffeekernel-build.log

              echo "[CoffeeOS] CoffeeKernel packages:"
              ls -lh dist/kernels/coffee/
              (cd dist/kernels/coffee && sha256sum -c SHA256SUMS)
              cat live-build/config/includes.chroot/usr/share/coffeeos/kernel-build-status.txt

              echo "[CoffeeOS] Building ISO with CoffeeKernel staged..."
              bash scripts/build-iso.sh \
                2>&1 | tee dist/github-custom-iso-build.log
            '

      - name: Detect reusable CoffeeKernel cache
        id: kernel-cache-ready
        if: always()
        run: |
          set -Eeuo pipefail
          if find .cache/coffeekernel -mindepth 2 -maxdepth 2 -type f -name SHA256SUMS -print -quit 2>/dev/null | grep -q .; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save reusable CoffeeKernel cache
        if: always() && steps.kernel-cache-ready.outputs.ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/coffeekernel
          key: coffeekernel-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('kernel/configs/coffee.conf', 'kernel/tools/configure.py', 'scripts/build-kernel.sh', 'scripts/build-coffeekernel-for-iso.sh', 'optimization/cache-policy.conf') }}-${{ github.run_id }}

      - name: Verify CoffeeKernel is staged
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          imgs=(dist/kernels/coffee/linux-image-*-coffee_*.deb)
          hdrs=(dist/kernels/coffee/linux-headers-*-coffee_*.deb)
          test "${#imgs[@]}" -eq 1
          test "${#hdrs[@]}" -eq 1
          dpkg-deb -f "${imgs[0]}" Package Version Architecture
          (cd dist/kernels/coffee && sha256sum -c SHA256SUMS)
          cat live-build/config/includes.chroot/usr/share/coffeeos/kernel-build-status.txt

      - name: Verify complete ISO payload and boot structures
        run: |
          set -Eeuo pipefail
          iso="$(find dist -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "$iso"
          test -s "$iso"
          bash scripts/verify-iso.sh "$iso"
          xorriso -indev "$iso" -report_el_torito as_mkisofs > dist/iso-boot-layout.txt
          ls -lh "$iso" "$iso.sha256"

      # Legacy BIOS support remains in the ISO, but CI intentionally skips
      # the BIOS QEMU smoke test. UEFI and full-disk installed boot are still
      # required before the artifact can be published.

      - name: UEFI boot smoke test
        run: |
          set -Eeuo pipefail
          iso="$(find dist -maxdepth 1 -type f -name '*.iso' -print -quit)"
          bash scripts/boot-smoke-test.sh --uefi "$iso"

      # Full-disk install/installed-boot QEMU testing is intentionally skipped
      # in CI. The installer and install-smoke-test tooling remain in the repo,
      # while release gating still requires source validation, CoffeeKernel
      # staging, complete ISO payload verification, and UEFI live boot.

      - name: Upload CoffeeKernel ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoffeeOS-CoffeeKernel-ISO
          path: |
            dist/*.iso
            dist/*.iso.sha256
            dist/kernels/coffee/*.deb
            dist/kernels/coffee/SHA256SUMS
            dist/kernels/coffee/build-info.json
            live-build/config/packages.chroot/coffeeos-system_*.deb
            dist/github-coffeekernel-build.log
            dist/github-custom-iso-build.log
            dist/iso-boot-layout.txt
          compression-level: 0
          if-no-files-found: error

      - name: Publish downloadable CoffeeKernel ISO release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          iso="$(find dist -maxdepth 1 -type f -name '*.iso' -print -quit)"
          tag="coffeeos-coffeekernel-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            "$iso" "$iso.sha256" \
            dist/kernels/coffee/linux-image-*-coffee_*.deb \
            dist/kernels/coffee/linux-headers-*-coffee_*.deb \
            dist/kernels/coffee/SHA256SUMS \
            dist/kernels/coffee/build-info.json \
            live-build/config/packages.chroot/coffeeos-system_*.deb \
            --title "CoffeeOS CoffeeKernel ISO ${GITHUB_RUN_NUMBER}" \
            --notes "CoffeeOS development ISO built after the configured 20-meaningful-update cadence or an explicit maintainer request. Built on Debian 13 Trixie with a verified CoffeeKernel package pair. CoffeeKernel is reused from the persistent cache or a compatible prior release when kernel inputs are unchanged, and rebuilt automatically when required. Secure Boot support is not enabled for this development image."
