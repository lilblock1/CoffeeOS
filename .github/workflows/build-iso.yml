name: Build CoffeeOS ISO

on:
  workflow_dispatch:
    inputs:
      run_qemu_smoke_test:
        description: Run QEMU boot smoke test
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Require CoffeeOS source tree
        run: |
          test -x scripts/build-iso.sh || {
            echo "::error::CoffeeOS source tree is not imported yet."
            exit 1
          }

      - name: Restore build caches
        uses: actions/cache@v4
        with:
          path: |
            .ci-cache/ccache
            .ci-cache/optimized
            .ci-cache/kernel
            .ci-cache/live-build
          key: coffeeos-${{ runner.os }}-${{ hashFiles('optimization/**', 'kernel/**', 'scripts/build-kernel.sh', 'scripts/build-optimized-packages.sh') }}
          restore-keys: |
            coffeeos-${{ runner.os }}-

      - name: Build in Debian 13
        shell: bash
        run: |
          mkdir -p "$PWD/.ci-cache"/{ccache,optimized,kernel,live-build}
          docker run --rm --privileged             -v "$PWD:/work"             -w /work             -e COFFEE_CCACHE_DIR=/work/.ci-cache/ccache             -e COFFEE_OPT_CACHE_DIR=/work/.ci-cache/optimized             -e COFFEE_KERNEL_CACHE_DIR=/work/.ci-cache/kernel             -e COFFEE_LIVE_BUILD_CACHE_DIR=/work/.ci-cache/live-build             debian:trixie bash -lc '
              set -euxo pipefail
              apt-get update
              apt-get install -y live-build debootstrap squashfs-tools xorriso rsync                 syslinux-common isolinux grub-pc-bin grub-efi-amd64-bin mtools dosfstools                 qemu-system-x86 dpkg-dev apt-utils gnupg python3 ccache build-essential                 bc bison flex libssl-dev libelf-dev dwarves kmod fakeroot devscripts
              bash scripts/validate.sh
              bash scripts/build-coffeekernel-for-iso.sh
              bash scripts/build-optimized-packages.sh --mode deep
              bash scripts/build-iso.sh
              bash scripts/verify-iso.sh
            '

      - name: QEMU boot smoke test
        if: inputs.run_qemu_smoke_test
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
          bash scripts/test-qemu.sh --bios

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: coffeeos-iso
          path: |
            dist/*.iso
            dist/*.sha256
            dist/build.log
          if-no-files-found: error
