name: Publish CoffeeOS Updates

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel
        type: choice
        options: [dev, beta, stable]
        required: true
        default: dev
      release_tag:
        description: Optional tested release tag whose .deb packages should be merged into the channel
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - live-build/config/includes.chroot/**
      - scripts/build-coffeeos-system-package.sh
      - .github/workflows/publish-updates.yml
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: coffeeos-github-updates
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name != 'release' ||
      startsWith(github.event.release.tag_name, 'coffeeos-coffeekernel-')
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve channel and package source
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_TAG: ${{ inputs.release_tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" == release ]]; then
            channel=dev
            source_tag="$RELEASE_TAG"
            mode=release
          elif [[ "$EVENT_NAME" == workflow_dispatch && -n "$INPUT_TAG" ]]; then
            channel="${INPUT_CHANNEL:-dev}"
            source_tag="$INPUT_TAG"
            mode=release
          else
            channel=dev
            source_tag=
            mode=source
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "source_tag=$source_tag" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "update_tag=coffeeos-updates-$channel" >> "$GITHUB_OUTPUT"

      - name: Install package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev

      - name: Restore packages already published to this channel
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_TAG: ${{ steps.source.outputs.update_tag }}
        run: |
          set -Eeuo pipefail
          mkdir -p incoming
          if gh release view "$UPDATE_TAG" >/dev/null 2>&1; then
            gh release download "$UPDATE_TAG" --pattern '*.deb' --dir incoming || true
          fi

      - name: Build current CoffeeOS userspace package
        if: steps.source.outputs.mode == 'source'
        run: |
          set -Eeuo pipefail
          bash scripts/build-coffeeos-system-package.sh
          cp -v live-build/config/packages.chroot/coffeeos-system_*.deb incoming/

      - name: Merge packages from tested CoffeeKernel release
        if: steps.source.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ steps.source.outputs.source_tag }}
        run: |
          set -Eeuo pipefail
          gh release download "$SOURCE_TAG" --pattern '*.deb' --dir incoming --clobber

      - name: Select newest package version and build manifest
        env:
          CHANNEL: ${{ steps.source.outputs.channel }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          mkdir -p publish
          python3 - <<'PY'
          import hashlib, json, os, shutil, subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          incoming=Path('incoming')
          selected={}
          for deb in sorted(incoming.glob('*.deb')):
              def field(name):
                  return subprocess.check_output(['dpkg-deb','-f',str(deb),name],text=True).strip()
              pkg=field('Package'); version=field('Version'); arch=field('Architecture')
              key=(pkg,arch)
              old=selected.get(key)
              if old is None or subprocess.run(['dpkg','--compare-versions',version,'gt',old['version']]).returncode==0:
                  selected[key]={'path':deb,'package':pkg,'version':version,'architecture':arch}

          if not selected:
              raise SystemExit('No update packages were found.')

          records=[]
          out=Path('publish')
          for item in sorted(selected.values(),key=lambda x:(x['package'],x['architecture'])):
              # GitHub normalizes '~' in release asset names. Use a stable safe
              # filename while retaining the real Debian Version inside the .deb.
              asset_name=item['path'].name.replace('~','_')
              dst=out/asset_name
              shutil.copy2(item['path'],dst)
              digest=hashlib.sha256(dst.read_bytes()).hexdigest()
              records.append({
                  'package':item['package'],
                  'version':item['version'],
                  'architecture':item['architecture'],
                  'asset':dst.name,
                  'sha256':digest,
                  'size':dst.stat().st_size,
                  'auto_install': not item['package'].startswith('linux-headers-'),
              })

          manifest={
              'schema':1,
              'repo':'lilblock1/CoffeeOS',
              'channel':os.environ['CHANNEL'],
              'generated_at':datetime.now(timezone.utc).isoformat(),
              'source_commit':os.environ['SOURCE_SHA'],
              'packages':records,
          }
          (out/'coffeeos-update.json').write_text(json.dumps(manifest,indent=2)+'\n')
          with (out/'SHA256SUMS').open('w') as sums:
              for item in records:
                  sums.write(item['sha256']+'  '+item['asset']+'\n')
          PY
          cat publish/coffeeos-update.json
          (cd publish && sha256sum -c SHA256SUMS)

      - name: Publish moving GitHub update release
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_TAG: ${{ steps.source.outputs.update_tag }}
          CHANNEL: ${{ steps.source.outputs.channel }}
        run: |
          set -Eeuo pipefail
          if ! gh release view "$UPDATE_TAG" >/dev/null 2>&1; then
            gh release create "$UPDATE_TAG" \
              --target "$GITHUB_SHA" \
              --title "CoffeeOS $CHANNEL Updates" \
              --notes "Moving CoffeeOS $CHANNEL update channel used by installed systems. Assets are replaced as newer tested packages are published." \
              --prerelease
          fi

          # Keep one clean package set per channel instead of creating release spam.
          while IFS= read -r asset; do
            [[ -n "$asset" ]] || continue
            case "$asset" in
              *.deb|coffeeos-update.json|SHA256SUMS)
                gh release delete-asset "$UPDATE_TAG" "$asset" -y || true ;;
            esac
          done < <(gh release view "$UPDATE_TAG" --json assets --jq '.assets[].name')

          gh release upload "$UPDATE_TAG" publish/*.deb publish/coffeeos-update.json publish/SHA256SUMS --clobber
          gh release edit "$UPDATE_TAG" \
            --title "CoffeeOS $CHANNEL Updates" \
            --notes "Moving CoffeeOS $CHANNEL update channel. Latest package manifest commit: $GITHUB_SHA. This release is updated in place and does not represent a new ISO."

      - name: Verify published manifest is reachable
        env:
          UPDATE_TAG: ${{ steps.source.outputs.update_tag }}
        run: |
          set -Eeuo pipefail
          url="https://github.com/lilblock1/CoffeeOS/releases/download/$UPDATE_TAG/coffeeos-update.json"
          curl -fL --retry 4 --retry-delay 2 "$url" -o /tmp/coffeeos-update.json
          python3 -m json.tool /tmp/coffeeos-update.json >/dev/null
          python3 - <<'PY'
          import hashlib,json,subprocess,tempfile
          from pathlib import Path
          data=json.loads(Path('/tmp/coffeeos-update.json').read_text())
          tag='coffeeos-updates-'+data['channel']
          with tempfile.TemporaryDirectory() as td:
              root=Path(td)
              for item in data['packages']:
                  dst=root/item['asset']
                  url=f"https://github.com/lilblock1/CoffeeOS/releases/download/{tag}/{item['asset']}"
                  subprocess.run(['curl','-fL','--retry','4','--retry-delay','2',url,'-o',str(dst)],check=True)
                  actual=hashlib.sha256(dst.read_bytes()).hexdigest()
                  if actual != item['sha256']:
                      raise SystemExit('Published SHA256 mismatch: '+item['asset'])
          PY
